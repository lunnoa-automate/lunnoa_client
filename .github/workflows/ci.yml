name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Validate publish tarball includes dist + skills
        run: |
          set -euo pipefail
          tarball=$(npm pack)
          echo "Packed $tarball"
          tar -tzf "$tarball" | tee /tmp/tarball-files.txt
          grep -q 'package/dist/index.js' /tmp/tarball-files.txt
          grep -q 'package/skills/lunnoa-client/SKILL.md' /tmp/tarball-files.txt
          grep -q 'package/skills/lunnoa-solution-design/SKILL.md' /tmp/tarball-files.txt
          rm -f "$tarball"
